joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# Front Left Wheel Velocity Controller
front_left_wheel_velocity_controller:
  type: velocity_controllers/JointVelocityController
  joint: front_left_wheel_joint

# Front Right Wheel Velocity Controller
front_right_wheel_velocity_controller:
  type: velocity_controllers/JointVelocityController
  joint: front_right_wheel_joint

# Rear Left Wheel Velocity Controller
rear_left_wheel_velocity_controller:
  type: velocity_controllers/JointVelocityController
  joint: rear_left_wheel_joint

# Rear Right Wheel Velocity Controller
rear_right_wheel_velocity_controller:
  type: velocity_controllers/JointVelocityController
  joint: rear_right_wheel_joint

# Front Left Steering Position Controller
front_left_steering_position_controller:
  type: position_controllers/JointPositionController
  joint: front_left_steering_joint
  pid: {p: 40.0, i: 0.1, d: 1.0}

# Front Right Steering Position Controller
front_right_steering_position_controller:
  type: position_controllers/JointPositionController
  joint: front_right_steering_joint
  pid: {p: 40.0, i: 0.1, d: 1.0}
